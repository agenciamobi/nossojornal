name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: TypeScript and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run quality

  php-lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint API PHP
        shell: bash
        run: |
          set -euo pipefail
          find public/api -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n1 php -l

      - name: Validate editorial HMAC contract
        run: php scripts/validate-editorial-hmac.php

  official-editorial-media-transport:
    name: Official media transport (ephemeral, unmerged)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transport official ESA images as verified base64 text
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --proto '=https' --tlsv1.2 --max-time 30 'https://cdn.esawebb.org/archives/images/screen/potm2609a.jpg' -o /tmp/esa-webb.jpg
          curl -fLSs --proto '=https' --tlsv1.2 --max-time 30 'https://cdn.esahubble.org/archives/images/screen/potw1412a.jpg' -o /tmp/esa-hubble.jpg
          python3 - <<'PY'
          import base64, hashlib, pathlib
          for name, path in [("webb", "/tmp/esa-webb.jpg"),("hubble", "/tmp/esa-hubble.jpg")]:
              payload=pathlib.Path(path).read_bytes()
              if not (payload[:3] == bytes([255, 216, 255]) and len(payload) < 3_000_000):
                  raise RuntimeError(f"unexpected image: {name}")
              encoded=base64.b64encode(payload).decode('ascii')
              print(f"NJMEDIA_META:{name}:{len(payload)}:{hashlib.sha256(payload).hexdigest()}")
              for index in range(0, len(encoded), 7500):
                  print(f"NJMEDIA_CHUNK:{name}:{index // 7500}:{encoded[index:index+7500]}")
              print(f"NJMEDIA_END:{name}")
          PY
